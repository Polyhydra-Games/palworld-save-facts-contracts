name: Release contracts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test and pack
        run: |
          dotnet test PalworldSaveFacts.Contracts.sln -c Release
          dotnet pack PalworldSaveFacts.Contracts.sln -c Release -o artifacts
          sha256sum artifacts/*.nupkg > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts/*.nupkg
            artifacts/SHA256SUMS.txt
            schema/*.schema.json
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: nuget-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish to internal BaGet feed
        env:
          BAGET_API_KEY: ${{ secrets.BAGET_API_KEY }}
        run: |
          test -n "$BAGET_API_KEY"
          mapfile -t packages < <(find release -type f -name '*.nupkg' | sort)
          test "${#packages[@]}" -eq 1
          dotnet nuget push "${packages[0]}" --source https://nuget.polyhydragames.com/v3/index.json --api-key "$BAGET_API_KEY" --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release/**
